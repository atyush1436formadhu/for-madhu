<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Madhu ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffb6c1,#ffd6e8,#fff0f5);

overflow:hidden;

}

.card{

width:90%;
max-width:420px;

padding:40px;

background:rgba(255,255,255,.25);

backdrop-filter:blur(20px);

border-radius:25px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.2);

animation:fade 1.5s;

}

h1{

font-size:34px;

color:#ff2d75;

margin-bottom:15px;

}

p{

font-size:18px;

color:#333;

line-height:1.6;

margin-bottom:30px;

}

button{

padding:15px 35px;

border:none;

border-radius:40px;

font-size:18px;

background:#ff2d75;

color:white;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.08);

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="card">

<h1>💌 For Madhu</h1>

<p>

Someone loves you more than words can ever explain...

</p>

<button>

Open My Heart ❤️

</button>

</div>

</body>

</html>
